<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCCDF4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レシピ帳">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>レシピ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --lav-300:#D9C8F2; --lav-400:#C7AEF0;
  --violet:#6C4BB5; --violet-d:#563A98;
  --ink:#2B2140; --muted:#5F5379; --line:rgba(108,75,181,.28);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#D3BFF1}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#DCCDF4 0%,#CDB8F1 55%,#D9C8F2 100%)}
body.lock{overflow:hidden}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.page-head{padding:calc(16px + env(safe-area-inset-top)) 20px 4px}
.page-head h1{margin:0;font-size:20px}

/* recipes: header */
.sticky{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(to bottom,rgba(220,205,244,.97),rgba(220,205,244,.88));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{display:flex;gap:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:16px;
  background:rgba(255,255,255,.74);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(108,75,181,.12)}
.search:focus-within{box-shadow:0 0 0 2px var(--violet)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--font);color:var(--ink);outline:none}
.search input::placeholder{color:#8F84A8}
.icon-btn{flex:none;width:46px;height:46px;border:0;border-radius:16px;background:rgba(255,255,255,.74);color:var(--violet);display:grid;place-items:center;cursor:pointer}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:2px 0 0}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.55);
  color:var(--violet-d);font:700 13.5px var(--font);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.panel .chip{background:#fff}
.panel .chip.on{background:var(--violet)}

/* grid */
.count{margin:10px 20px 8px;min-height:1.2em;font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 16px}
.card{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:22px;overflow:hidden;cursor:pointer;
  background:linear-gradient(135deg,#CBB5F0,#E6DAF8);box-shadow:0 8px 20px rgba(88,60,150,.2);text-align:left;transition:transform .12s}
.card:active{transform:scale(.97)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph,.hero .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(108,75,181,.5)}
.card-title{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;color:#fff;font-weight:700;font-size:13.5px;line-height:1.4;
  background:linear-gradient(to top,rgba(43,26,80,.84),rgba(43,26,80,0));text-shadow:0 1px 3px rgba(0,0,0,.35)}
.card-title .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-cook{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--violet-d);font-size:11px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:56px 24px;color:var(--muted);font-size:14px;line-height:1.9}
.empty svg{display:block;margin:0 auto 12px;color:var(--violet);opacity:.7}

/* fab / tabbar */
.fab{position:fixed;z-index:6;bottom:calc(80px + env(safe-area-inset-bottom));right:calc(max(0px,(100vw - 480px)/2) + 20px);
  width:62px;height:62px;border-radius:50%;border:0;background:var(--violet);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(86,58,152,.45);cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.94)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(251,248,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(108,75,181,.14);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;height:62px;display:grid;place-items:center;align-content:center;gap:3px;color:#8F84A8;font:700 11px var(--font);cursor:pointer}
.tab[aria-current="page"]{color:var(--violet)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,26,80,0);transition:background .22s}
.overlay.open{background:rgba(43,26,80,.42)}
#catSheet,#pick{z-index:30}
.panel{width:100%;max-width:480px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:#FBF8FF;
  border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.panel.tall{height:96vh;height:96dvh;max-height:none}
.overlay.open .panel{transform:none}
.panel-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 12px 8px;border-bottom:1px solid rgba(108,75,181,.12)}
.panel-head h2{margin:0;font-size:16px;font-weight:700}
.panel-head .l{justify-self:start}
.panel-head .r{justify-self:end}
.text-btn{border:0;background:none;font:700 15px var(--font);color:var(--muted);padding:8px;cursor:pointer}
.text-btn.strong{color:var(--violet)}
.text-btn:disabled{opacity:.4;cursor:default}
.panel-body{overflow-y:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.field{margin-bottom:18px}
.lbl{display:block;margin-bottom:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.lbl small{font-weight:500}
.lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lbl-row .lbl{margin:0}
.link-btn{border:0;background:none;color:var(--violet);font:700 13px var(--font);cursor:pointer;padding:4px 0}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=number],textarea{
  width:100%;border:0;border-radius:14px;background:#F0E8FB;padding:0 14px;font:500 16px var(--font);color:var(--ink);outline:none}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=number]{height:48px}
textarea{padding:12px 14px;line-height:1.7;resize:vertical;min-height:120px}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--violet)}
.row{display:flex;gap:8px}
.row.two>*{flex:1;min-width:0}
.pill-btn{flex:none;height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--lav-300);color:var(--violet-d);font:700 14px var(--font);cursor:pointer}
.pill-btn.strong{background:var(--violet);color:#fff}
.status{min-height:1.4em;margin:-8px 0 12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
.status.warn{color:#8B4A1B}
.status.ok{color:#2F7A4A}
.photo{position:relative;width:132px;height:132px;border:0;border-radius:22px;overflow:hidden;background:#E6DAF8;color:var(--violet);
  cursor:pointer;display:grid;place-items:center;align-content:center;gap:6px;font:700 12.5px var(--font)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .badge{position:absolute;right:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:rgba(43,26,80,.68);color:#fff;font-size:11.5px}
.danger{display:block;width:100%;margin-top:14px;padding:12px;border:0;background:none;color:#B3261E;font:700 14px var(--font);cursor:pointer}
.cat-list,.pick-list{list-style:none;margin:0 0 14px;padding:0}
.cat-list li{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:6px 8px 6px 16px;border-radius:14px;background:#F0E8FB;font-weight:700;font-size:15px}
.cat-list .x{width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.hint{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* detail */
#detail .panel-body{padding:0 0 24px}
.d-top{display:flex;gap:16px;align-items:flex-start;padding:18px 20px 0}
.d-thumb{position:relative;flex:none;width:104px;height:104px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#CBB5F0,#E6DAF8)}
.d-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.d-info{flex:1;min-width:0}
.d-title{margin:0 0 8px;font-size:19px;line-height:1.45;font-weight:700}
.d-meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#EFE7FB;color:var(--violet-d);font-size:12.5px;font-weight:700;text-decoration:none}
a.pill{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.d-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 20px 0}
.tag{padding:3px 10px;border-radius:999px;background:#F0E8FB;color:var(--violet-d);font-size:12px;font-weight:700}
.sec{padding:22px 20px 0}
.sec h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{font-size:12px;color:var(--muted);font-weight:500}
.ing{list-style:none;margin:0;padding:0;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(108,75,181,.12);overflow:hidden}
.ing li{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;border-top:1px solid rgba(108,75,181,.1);cursor:pointer;font-size:15px;line-height:1.5}
.ing li:first-child{border-top:0}
.ing .am{flex:none;max-width:52%;color:var(--violet-d);font-weight:700;text-align:right}
.ing .grp{background:#F4EEFC;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px 16px;cursor:default}
.ing li.done .nm,.ing li.done .am{opacity:.38;text-decoration:line-through}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px;padding:15px 0;border-top:1px solid rgba(108,75,181,.12);cursor:pointer}
.step:first-child{border-top:0;padding-top:4px}
.step .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.step p{margin:0;font-size:15.5px;line-height:1.75}
.step.done p{opacity:.38;text-decoration:line-through}
.step.done .no{background:#B9A6DD}
.noinfo{margin:20px 20px 0;padding:18px;border-radius:18px;background:#F4EEFC;color:var(--muted);font-size:13.5px;line-height:1.7;text-align:center}
.noinfo .pill-btn{margin-top:12px;height:44px}
.cook-sum{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--violet-d)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 11px;border-radius:999px;background:#F0E8FB;font-size:12px;font-weight:700;color:var(--violet-d)}
.cchip button{width:22px;height:22px;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.foot{flex:none;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(108,75,181,.14);background:#FBF8FF}
.foot input{flex:1;min-width:0}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
.cal-nav .mt{flex:1;text-align:center;font-size:18px;font-weight:700}
.round{width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.74);color:var(--violet);font:700 14px var(--font);cursor:pointer;display:grid;place-items:center}
.round.txt{width:auto;padding:0 14px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 12px}
.cal-week span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.cal-week span:first-child{color:#B5486A}
.day{position:relative;aspect-ratio:1/1.18;padding:0;border:0;border-radius:12px;background:rgba(255,255,255,.55);overflow:hidden;cursor:pointer}
.day.blank{background:none;cursor:default;visibility:hidden}
.day .dn{position:absolute;z-index:1;left:3px;top:3px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:grid;place-items:center;font:700 11.5px/1 var(--font);color:var(--ink)}
.day.has .dn{background:rgba(43,26,80,.68);color:#fff}
.day.today .dn{background:var(--violet);color:#fff}
.day.sel{box-shadow:0 0 0 2.5px var(--violet)}
.mosaic{position:absolute;inset:0;display:grid;gap:1.5px}
.mosaic.m1{grid-template:1fr/1fr}
.mosaic.m2{grid-template:1fr/1fr 1fr}
.mosaic.m3,.mosaic.m4{grid-template:1fr 1fr/1fr 1fr}
.mosaic.m3 .tile:first-child{grid-row:span 2}
.tile{overflow:hidden;background:#D3C2F1}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{display:grid;place-items:center;width:100%;height:100%;padding-top:12px;color:rgba(108,75,181,.6)}
.tile .ph svg{width:70%;max-width:24px;height:auto}
.more{position:absolute;z-index:1;right:3px;bottom:3px;padding:1px 5px;border-radius:8px;background:rgba(43,26,80,.74);color:#fff;font:700 10px var(--font)}
.day-panel{margin:16px 16px 0;padding:16px;border-radius:22px;background:rgba(255,255,255,.72)}
.day-panel h2{margin:0 0 10px;font-size:16px}
.day-list{list-style:none;margin:0 0 12px;padding:0}
.day-item{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.di-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:6px;border:0;border-radius:14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.th{flex:none;width:52px;height:52px;border-radius:12px;overflow:hidden;background:#E2D5F6}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.di-main .nm{font-weight:700;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.di-x{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.wide-btn{display:block;width:100%;height:48px;border:0;border-radius:14px;background:var(--violet);color:#fff;font:700 15px var(--font);cursor:pointer}
.pick-list li{margin-bottom:8px}
.pick-list .di-main{width:100%;background:#F0E8FB}

/* account */
.box{margin:12px 16px 0;padding:16px;border-radius:20px;background:rgba(255,255,255,.72)}
.box h3{margin:0 0 6px;font-size:15px}
.box p{margin:0 0 10px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.box p:last-child{margin-bottom:0}
.box .kv{font-weight:700;color:var(--ink)}

/* auth */
#auth{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
  background:linear-gradient(160deg,#E4D8F7 0%,#CDB8F1 55%,#D9C8F2 100%)}
.auth-box{width:100%;max-width:380px}
.auth-box h1{margin:0 0 6px;font-size:26px}
.auth-box p{margin:0 0 20px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.auth-box input{margin-bottom:10px;background:#fff}
.auth-err{min-height:1.5em;margin:0 0 8px!important;font-size:13px!important;color:#B3261E!important}
.auth-box .wide-btn{margin-top:4px}
.auth-links{display:flex;justify-content:space-between;margin-top:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:calc(100% - 40px);transform:translate(-50%,8px);
  padding:11px 18px;border-radius:14px;background:rgba(43,26,80,.94);color:#fff;font-size:13.5px;font-weight:700;line-height:1.5;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <!-- レシピ -->
  <section id="view-recipes">
    <div class="sticky">
      <div class="bar">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="レシピ名・カテゴリから検索" autocomplete="off" enterkeyhint="search">
        </label>
        <button class="icon-btn" id="btnCats" type="button" aria-label="カテゴリを編集">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </div>
      <nav class="chips" id="chips" aria-label="具材で絞り込み"></nav>
    </div>
    <p class="count" id="count"></p>
    <main class="grid" id="grid"></main>
  </section>

  <!-- カレンダー -->
  <section id="view-cal" hidden>
    <div class="page-head"><h1>作った日カレンダー</h1></div>
    <div class="cal-nav">
      <button class="round" id="calPrev" type="button" aria-label="前の月">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="mt" id="calTitle"></div>
      <button class="round txt" id="calToday" type="button">今日</button>
      <button class="round" id="calNext" type="button" aria-label="次の月">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="cal-week" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="day-panel">
      <h2 id="dayTitle"></h2>
      <ul class="day-list" id="dayList"></ul>
      <button class="wide-btn" id="btnAddCook" type="button">この日に作った料理を記録</button>
    </div>
  </section>

  <!-- アカウント -->
  <section id="view-acct" hidden>
    <div class="page-head"><h1>アカウント</h1></div>
    <div id="acctBody"></div>
  </section>
</div>

<button class="fab" id="fab" type="button" aria-label="レシピを追加">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="メイン">
  <div class="in">
    <button class="tab" type="button" data-tab="recipes" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
      レシピ
    </button>
    <button class="tab" type="button" data-tab="cal">

<script>
(() => {
'use strict';

/* =====================================================================
   設定（マニュアルの手順で値を入れてください）
   空のままでも「この端末だけ」で動きます。
   ===================================================================== */
const CONFIG = {
  firebase: { apiKey: 'AIzaSyBgXa2dvNylf8CPkFRVyTIodQCM5WvoQdU', authDomain: 'chi-recipe.firebaseapp.com', projectId: 'chi-recipe', appId: '1:666632086884:web:45c44e6b6ec0549eac4671' },
  workerUrl: 'https://recipe-api.h4ygjng57h.workers.dev',        // 例: https://recipe-api.あなたのID.workers.dev
  emulator: false       // 開発用（通常は false）
};

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const LS_KEY = 'recipebox.v1';
const DEFAULT_CATS = ['鶏肉','豚肉','牛肉','ひき肉','魚','サーモン','エビ・イカ','卵','豆腐','野菜','きのこ','チーズ','パスタ・麺','ごはん'];
const cloudConfigured = !!(CONFIG.firebase.apiKey && CONFIG.firebase.projectId);

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const extractUrl = t => { const m = String(t || '').match(/https?:\/\/[^\s<>"'）)」』]+/); return m ? m[0] : ''; };
const looksLikeUrl = u => /^https?:\/\/[^\s/]+\.[^\s/]{2,}/.test(u);
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const isInstagram = u => /(^|\.)(instagram\.com|instagr\.am)$/.test(hostOf(u));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const WD = '日月火水木金土';
function fmtDate(key){
  const [y, m, d] = key.split('-').map(Number);
  return (y === new Date().getFullYear() ? '' : y + '年') + `${m}月${d}日`;
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function svgEl(html){ const s = h('span'); s.innerHTML = html; return s.firstElementChild; }
const ICON_FORK = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/></svg>';
function placeholder(){ const d = h('div', { class: 'ph' }); d.innerHTML = ICON_FORK; return d; }

/* ---------- 材料・手順のテキスト変換 ---------- */
const AMOUNT_START = '(?:[0-9０-９½¼¾⅓⅔]|大さじ|小さじ|約|少々|適量|適宜|ひとつまみ|ひとかけ|お好み|好みで|少量|たっぷり)';
const ING_RE = new RegExp(`^(.+?)[\\s\\u3000:：]+(${AMOUNT_START}.*)$`);
const ING_RE2 = new RegExp(`^(.*?[^\\d\\s０-９])((?:[0-9０-９½¼¾⅓⅔]|大さじ|小さじ|少々|適量|適宜).*)$`);
function splitIng(s){
  s = s.trim();
  const m = s.match(ING_RE) || s.match(ING_RE2);
  return m ? { name: m[1].trim(), amount: m[2].trim() } : { name: s, amount: '' };
}
const STEP_NO = /^\s*(?:[0-9０-９]+[.．)）:：、]|[①-⑳]|(?:step|手順)\s*[0-9０-９]+[.:：]?)\s*/i;

function ingToText(list){
  let g = ''; const out = [];
  list.forEach(i => {
    const ig = i.group || '';
    if (ig !== g) { g = ig; out.push('■' + g); }
    out.push([i.name, i.amount].filter(Boolean).join(' '));
  });
  return out.join('\n');
}
function textToIng(t){
  let g = ''; const out = [];
  t.split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (l[0] === '■') { g = l.slice(1).trim(); return; }
    const it = splitIng(l);
    if (g) it.group = g;
    out.push(it);
  });
  return out;
}
const stepsToText = a => a.join('\n');
const textToSteps = t => t.split('\n').map(l => l.replace(STEP_NO, '').trim()).filter(Boolean);

function normRecipe(r){
  return {
    id: r.id, url: r.url || '', name: r.name || '', cats: Array.isArray(r.cats) ? r.cats : [], img: r.img || '',
    createdAt: r.createdAt || 0, site: r.site || '', servings: r.servings || '', minutes: Number(r.minutes) || 0,
    ingredients: Array.isArray(r.ingredients) ? r.ingredients.filter(x => x && x.name)
      .map(x => ({ name: String(x.name), amount: String(x.amount || ''), ...(x.group ? { group: String(x.group) } : {}) })) : [],
    steps: Array.isArray(r.steps) ? r.steps.map(String).filter(Boolean) : []
  };
}

/* =====================================================================
   データ層：ローカル（この端末）／クラウド（Firestore）
   ===================================================================== */
const state = { recipes: [], cats: DEFAULT_CATS.slice(), cooks: [], ready: false };
const recipeById = id => state.recipes.find(r => r.id === id);

function loadLocal(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && Array.isArray(s.recipes)) {
      return { recipes: s.recipes.map(normRecipe), cats: Array.isArray(s.cats) ? s.cats : DEFAULT_CATS.slice(), cooks: Array.isArray(s.cooks) ? s.cooks : [] };
    }
  } catch (e) {}
  return { recipes: [], cats: DEFAULT_CATS.slice(), cooks: [] };
}
function commitLocal(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ recipes: state.recipes, cats: state.cats, cooks: state.cooks }));
    refresh(); return true;
  } catch (e) {
    Object.assign(state, loadLocal());
    refresh(); toast('保存できませんでした。容量がいっぱいの可能性があります');
    return false;
  }
}
const localStore = {
  mode: 'local',
  async saveRecipe(rec){ const i = state.recipes.findIndex(r => r.id === rec.id); if (i >= 0) state.recipes[i] = rec; else state.recipes.push(rec); return commitLocal(); },
  async deleteRecipe(id){ state.recipes = state.recipes.filter(r => r.id !== id); state.cooks = state.cooks.filter(c => c.recipeId !== id); return commitLocal(); },
  async saveCats(cats){ state.cats = cats; return commitLocal(); },
  async deleteCat(name){ state.cats = state.cats.filter(c => c !== name); state.recipes.forEach(r => { r.cats = r.cats.filter(c => c !== name); }); return commitLocal(); },
  async addCook(c){ state.cooks.push(c); return commitLocal(); },
  async deleteCook(id){ state.cooks = state.cooks.filter(c => c.id !== id); return commitLocal(); }
};

let store = localStore;
let cloud = null;      // { A, F, auth, db, user, unsubs }

const plain = o => JSON.parse(JSON.stringify(o));
function makeCloudStore(F, db, uid_){
  const d = (n, id) => F.doc(db, 'users', uid_, n, id);
  const fail = e => { console.error(e); toast('同期エラー：' + (e.code || e.message)); };
  return {
    mode: 'cloud',
    async saveRecipe(rec){ F.setDoc(d('recipes', rec.id), plain(rec)).catch(fail); return true; },
    async deleteRecipe(id){
      const b = F.writeBatch(db); b.delete(d('recipes', id));
      state.cooks.filter(c => c.recipeId === id).forEach(c => b.delete(d('cooks', c.id)));
      b.commit().catch(fail); return true;
    },
    async saveCats(cats){ F.setDoc(d('meta', 'settings'), { cats }).catch(fail); return true; },
    async deleteCat(name){
      const b = F.writeBatch(db);
      b.set(d('meta', 'settings'), { cats: state.cats.filter(c => c !== name) });
      state.recipes.filter(r => r.cats.includes(name)).forEach(r => b.update(d('recipes', r.id), { cats: r.cats.filter(c => c !== name) }));
      b.commit().catch(fail); return true;
    },
    async addCook(c){ F.setDoc(d('cooks', c.id), plain(c)).catch(fail); return true; },
    async deleteCook(id){ F.deleteDoc(d('cooks', id)).catch(fail); return true; }
  };
}

const idToken = () => cloud.auth.currentUser.getIdToken();
const workerReady = () => !!(CONFIG.workerUrl && cloud && cloud.auth && cloud.auth.currentUser);
const W = () => CONFIG.workerUrl.replace(/\/$/, '');

async function initCloud(){
  const B = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [{ initializeApp }, A, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = initializeApp(CONFIG.firebase);
  const auth = A.getAuth(app);
  let db;
  if (CONFIG.emulator) {
    db = F.initializeFirestore(app, {});
    A.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(db, '127.0.0.1', 8080);
  } else {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  }
  cloud = { A, F, auth, db, user: null, unsubs: [] };
  A.onAuthStateChanged(auth, user => { if (user) startCloud(user); else stopCloud(); });
}

function startCloud(user){
  const { F, db } = cloud;
  stopListeners();
  cloud.user = user;
  store = makeCloudStore(F, db, user.uid);
  state.recipes = []; state.cooks = []; state.cats = DEFAULT_CATS.slice(); state.ready = false;
  const col = n => F.collection(db, 'users', user.uid, n);
  const onErr = e => { console.error(e); toast(e.code === 'permission-denied' ? 'Firestoreのルール設定を確認してください' : '同期エラー：' + (e.code || e.message)); };
  cloud.unsubs = [
    F.onSnapshot(col('recipes'), s => { state.recipes = s.docs.map(x => normRecipe(x.data())); state.ready = true; refresh(); }, onErr),
    F.onSnapshot(col('cooks'), s => { state.cooks = s.docs.map(x => x.data()); refresh(); }, onErr),
    F.onSnapshot(F.doc(db, 'users', user.uid, 'meta', 'settings'), s => {
      state.cats = (s.exists() && Array.isArray(s.data().cats)) ? s.data().cats : DEFAULT_CATS.slice(); refresh();
    }, onErr)
  ];
  hideAuth();
  offerMigration(user.uid);
  refresh();
  consumeStartUrl();
}
function stopListeners(){ if (cloud) { cloud.unsubs.forEach(u => u()); cloud.unsubs = []; } }
function stopCloud(){
  stopListeners();
  if (cloud) cloud.user = null;
  store = localStore;
  state.recipes = []; state.cooks = []; state.cats = DEFAULT_CATS.slice(); state.ready = false;
  closeAllOverlays();
  refresh();
  showAuth('form');
}

// この端末に保存済みのレシピ（旧バージョンや未ログイン時）をクラウドへ追加
async function offerMigration(uid_){
  const flag = 'recipebox.migrated.' + uid_;
  if (localStorage.getItem(flag)) return;
  const local = loadLocal();
  if (!local.recipes.length && !local.cooks.length) return;
  localStorage.setItem(flag, '1');
  if (!confirm(`この端末に保存済みのレシピ${local.recipes.length}件をクラウドにも追加しますか？`)) return;
  try {
    const { F, db } = cloud;
    const ops = [
      ...local.recipes.map(r => ['recipes', r.id, plain(r)]),
      ...local.cooks.map(c => ['cooks', c.id, plain(c)])
    ];
    for (let i = 0; i < ops.length; i += 400) {
      const b = F.writeBatch(db);
      ops.slice(i, i + 400).forEach(([n, id, data]) => b.set(F.doc(db, 'users', uid_, n, id), data));
      await b.commit();
    }
    toast(`${local.recipes.length}件をクラウドに追加しました`);
  } catch (e) { console.error(e); toast('追加に失敗しました：' + (e.code || e.message)); }
}

/* ---------- ログイン画面 ---------- */
let authMode = 'login';
function showAuth(kind){
  $('#auth').hidden = false;
  $('#authLoading').hidden = kind !== 'loading';
  $('#authError').hidden = kind !== 'error';
  $('#authForm').hidden = kind !== 'form';
}
function hideAuth(){ $('#auth').hidden = true; }
function setAuthMode(m){
  authMode = m;
  $('#authSubmit').textContent = m === 'login' ? 'ログイン' : 'アカウントを作成';
  $('#authSwitch').textContent = m === 'login' ? 'はじめての方は新規登録' : 'ログインへ戻る';
  $('#authPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
}
const AUTH_MSG = {
  'auth/invalid-credential': 'メールアドレスまたはパスワードが違います',
  'auth/wrong-password': 'メールアドレスまたはパスワードが違います',
  'auth/user-not-found': 'メールアドレスまたはパスワードが違います',
  'auth/invalid-email': 'メールアドレスの形式が正しくありません',
  'auth/email-already-in-use': 'このメールアドレスは登録済みです。ログインしてください',
  'auth/weak-password': 'パスワードは6文字以上にしてください',
  'auth/too-many-requests': '試行回数が多すぎます。しばらくしてからお試しください',
  'auth/network-request-failed': '通信に失敗しました。接続を確認してください',
  'auth/operation-not-allowed': 'FirebaseでメールとパスワードのログインがONになっていません'
};
async function submitAuth(e){
  e.preventDefault();
  const email = $('#authEmail').value.trim(), pass = $('#authPass').value;
  if (!email || !pass) { $('#authErr').textContent = 'メールアドレスとパスワードを入力してください'; return; }
  const btn = $('#authSubmit'); btn.disabled = true; $('#authErr').textContent = '';
  try {
    if (authMode === 'login') await cloud.A.signInWithEmailAndPassword(cloud.auth, email, pass);
    else await cloud.A.createUserWithEmailAndPassword(cloud.auth, email, pass);
  } catch (err) { $('#authErr').textContent = AUTH_MSG[err.code] || ('エラー：' + (err.code || err.message)); }
  finally { btn.disabled = false; }
}
async function resetPassword(){
  const email = $('#authEmail').value.trim();
  if (!email) { $('#authErr').textContent = '上の欄にメールアドレスを入力してから押してください'; return; }
  try { await cloud.A.sendPasswordResetEmail(cloud.auth, email); $('#authErr').textContent = ''; toast('再設定用のメールを送りました'); }
  catch (err) { $('#authErr').textContent = AUTH_MSG[err.code] || ('エラー：' + (err.code || err.message)); }
}
$('#authForm').addEventListener('submit', submitAuth);
$('#authSwitch').addEventListener('click', () => setAuthMode(authMode === 'login' ? 'signup' : 'login'));
$('#authReset').addEventListener('click', resetPassword);
$('#authRetry').addEventListener('click', () => location.reload());
$('#authLocal').addEventListener('click', () => { hideAuth(); startLocal(); });

/* =====================================================================
   ホーム（レシピ一覧）
   ===================================================================== */
let activeCat = null;
let TAB = 'recipes';

function chip(label, on, onclick){
  return h('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), 'aria-pressed': String(on), onclick }, label);
}
function renderChips(){
  $('#chips').replaceChildren(
    chip('すべて', activeCat === null, () => { activeCat = null; render(); }),
    ...state.cats.map(c => chip(c, activeCat === c, () => { activeCat = activeCat === c ? null : c; render(); }))
  );
}
function thumbEl(r){
  if (!r.img) return placeholder();
  const img = h('img', { src: r.img, alt: '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' });
  img.addEventListener('error', () => img.replaceWith(placeholder()));
  return img;
}
function card(r, n){
  const el = h('button', { type: 'button', class: 'card', onclick: () => openDetail(r.id) }, thumbEl(r));
  if (n) el.append(h('span', { class: 'badge-cook' }, `作った ${n}回`));
  el.append(h('span', { class: 'card-title' }, h('span', { class: 't' }, r.name || hostOf(r.url) || '（名前なし）')));
  return el;
}
function render(){
  renderChips();
  const q = $('#q').value.trim().toLowerCase();
  const counts = new Map();
  state.cooks.forEach(c => counts.set(c.recipeId, (counts.get(c.recipeId) || 0) + 1));
  const list = state.recipes
    .filter(r => (!activeCat || r.cats.includes(activeCat)) &&
      (!q || (r.name || '').toLowerCase().includes(q) || r.cats.some(c => c.toLowerCase().includes(q))))
    .sort((a, b) => b.createdAt - a.createdAt);

  $('#count').textContent = state.recipes.length ? `${list.length}件` + (activeCat ? `（${activeCat}）` : '') : '';

  const grid = $('#grid');
  if (!list.length) {
    let msg;
    if (!state.ready) msg = '読み込み中…';
    else if (state.recipes.length) msg = activeCat ? `「${activeCat}」のレシピはまだありません` : '見つかりませんでした';
    else msg = '右下の＋からレシピのURLを貼り付けて、\nお気に入りを保存しましょう';
    const e = h('div', { class: 'empty' });
    if (state.ready) e.append(svgEl(ICON_FORK.replace('width="40" height="40"', 'width="44" height="44"')));
    msg.split('\n').forEach((line, i) => { if (i) e.append(h('br')); e.append(line); });
    grid.replaceChildren(e);
  } else grid.replaceChildren(...list.map(r => card(r, counts.get(r.id))));
}

/* ---------- overlay ---------- */
function show(ov){
  clearTimeout(ov._t);
  ov.hidden = false;
  document.body.classList.add('lock');
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('open')));
}
function hide(ov){
  ov.classList.remove('open');
  clearTimeout(ov._t);
  ov._t = setTimeout(() => {
    ov.hidden = true;
    if (![...document.querySelectorAll('.overlay')].some(o => !o.hidden)) document.body.classList.remove('lock');
  }, 240);
}
function closeAllOverlays(){
  document.querySelectorAll('.overlay').forEach(o => { clearTimeout(o._t); o.classList.remove('open'); o.hidden = true; });
  document.body.classList.remove('lock');
}

/* --- 取得 --- */
async function fetchT(url, ms, opts){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...(opts || {}), signal: c.signal }); } finally { clearTimeout(t); }
}

async function workerExtract(url){
  if (!workerReady()) return null;
  try {
    const r = await fetchT(W() + '/extract', 40000, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + await idToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) return { ok: false, error: j.error || ('http_' + r.status), detail: j.detail || '' };
    return j;
  } catch (e) { return { ok: false, error: 'network' }; }
}

async function microlinkMeta(url){         // Worker未設定時の簡易取得（タイトル・写真のみ）
  try {
    const r = await fetchT('https://api.microlink.io/?url=' + encodeURIComponent(url), 12000);
    if (r.status === 429) return { ok: false, reason: '簡易取得サービスの1日の利用上限に達した可能性があります' };
    const j = await r.json();
    if (j.status === 'success' && j.data) return { ok: true, title: j.data.title || '', image: (j.data.image && j.data.image.url) || '', ingredients: [], steps: [], source: 'meta' };
    return { ok: false, reason: '簡易取得サービスがそのページを読み取れませんでした' };
  } catch (e) {
    return { ok: false, reason: '簡易取得サービスに接続できませんでした（通信環境・広告ブロック・プレビュー画面の制限などの可能性）' };
  }
}

function blobToThumb(blob){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const s = 400, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('load')); };
    img.src = u;
  });
}
// 写真を400px角に縮小して保存する（元URLの期限切れ対策）。失敗時は元URLのまま使う
async function toThumb(imgUrl){
  try {
    let blob = null;
    if (workerReady()) {
      try {
        const r = await fetchT(W() + '/img?url=' + encodeURIComponent(imgUrl), 20000, { headers: { 'Authorization': 'Bearer ' + await idToken() } });
        if (r.ok) blob = await r.blob();
      } catch (e) {}
    }
    if (!blob) {
      const r = await fetchT('https://wsrv.nl/?url=' + encodeURIComponent(imgUrl) + '&w=400&h=400&fit=cover&a=attention&output=jpg&q=78', 15000);
      if (!r.ok) throw new Error('proxy');
      blob = await r.blob();
    }
    if (!blob.type.startsWith('image/')) throw new Error('type');
    return await blobToThumb(blob);
  } catch (e) { return imgUrl; }
}

function cleanTitle(t){
  t = (t || '').replace(/\s+/g, ' ').trim();
  t = t.split(/\s[|｜\-–—]\s/)[0].trim();
  t = t.replace(/\s*(の)?レシピ[・･]作り方.*$/, '').trim();
  return t.slice(0, 60);
}
const WORKER_ERR = {
  instagram_unavailable: 'Instagramから取得できませんでした（非公開の投稿、またはInstagram側の制限の可能性）。',
  invalid_token: 'ログインの有効期限が切れています。ログインし直してください。',
  unauthorized: 'ログインの有効期限が切れています。ログインし直してください。',
  forbidden: 'このアカウントはWorkerの許可リスト（ALLOWED_EMAILS）に入っていません。',
  network: 'Workerに接続できませんでした（index.html の CONFIG の workerUrl を確認してください）。',
  not_found: 'WorkerのURLが違うか、Workerのコードが古い可能性があります。',
  http_404: 'WorkerのURLが違うか、Workerのコードが古い可能性があります。',
  bad_url: 'URLの形式を読み取れませんでした。'
};
function workerErrText(code, detail){
  if (!code) return '';
  if (WORKER_ERR[code]) return WORKER_ERR[code];
  let m = /^fetch_failed_(\d+)$/.exec(code);
  if (m) return `レシピのサイトがWorkerからのアクセスを断りました（HTTP ${m[1]}）。`;
  m = /^(FIREBASE_PROJECT_ID|ALLOWED_EMAILS)_not_set$/.exec(code);
  if (m) return `Workerの環境変数「${m[1]}」が未設定です。`;
  if (code === 'server_error') return 'Worker内でエラーが発生しました' + (detail ? `（${detail}）` : '') + '。';
  return `Workerからのエラー：${code}`;
}

async function autoFill(url, force){
  const my = ++S.seq;
  S.lastUrl = url;
  if (force) ['ing', 'steps', 'serv', 'min'].forEach(k => S.touched.delete(k));
  else {
    if (!S.touched.has('name')) $('#fName').value = '';
    if (!S.touched.has('img')) { S.img = ''; renderPhoto(); }
    if (!S.touched.has('serv')) $('#fServ').value = '';
    if (!S.touched.has('min')) $('#fMin').value = '';
    if (!S.touched.has('ing')) setIngredients([]);
    if (!S.touched.has('steps')) $('#fSteps').value = '';
  }
  updateRefetch();

  const dup = state.recipes.find(r => r.url === url && r.id !== S.id);
  const dupNote = dup ? '（このURLは保存済みです）' : '';
  const ig = isInstagram(url);

  if (ig && !workerReady()) {
    setBusy(false);
    setStatus('Instagramの自動取得には、ログインとWorkerの設定が必要です。レシピ名・材料を入力し、スクリーンショットなどを「写真」から選んでください。' + dupNote, 'warn');
    return;
  }

  setBusy(true);
  setStatus(workerReady() ? 'レシピを解析中…（数秒〜十数秒かかることがあります）' : 'タイトルと写真を取得中…');
  let w = await workerExtract(url);
  if (my !== S.seq) return;
  const workerFail = w && !w.ok ? w : null;
  let ml = null;
  if (!w || !w.ok) { ml = ig ? null : await microlinkMeta(url); w = ml && ml.ok ? ml : null; }
  if (my !== S.seq) return;

  if (!w) {
    setBusy(false);
    const why = [];
    if (workerFail) why.push(workerErrText(workerFail.error, workerFail.detail));
    else if (!workerReady() && !ig) why.push('Workerが未設定（またはログイン前）のため、簡易取得を試しました。');
    if (ml && !ml.ok) why.push(ml.reason + '。');
    setStatus('自動取得できませんでした。' + why.join('') + 'レシピ名・材料・写真は手動で入力できます。' + dupNote, 'warn');
    return;
  }

  if (w.title && !S.touched.has('name') && !$('#fName').value.trim()) $('#fName').value = cleanTitle(w.title);
  if (w.servings && !S.touched.has('serv')) $('#fServ').value = w.servings;
  if (w.minutes && !S.touched.has('min')) $('#fMin').value = w.minutes;
  if (w.ingredients.length && !S.touched.has('ing')) setIngredients(w.ingredients);
  if (w.steps.length && !S.touched.has('steps')) $('#fSteps').value = stepsToText(w.steps);
  S.site = w.siteName || hostOf(url);
  if (w.image && !S.touched.has('img')) {
    const t = await toThumb(w.image);
    if (my !== S.seq) return;
    S.img = t; renderPhoto();
  }
  setBusy(false);

  const n = w.ingredients.length, m = w.steps.length;
  let msg, kind;
  if (n || m) {
    msg = `材料${n}件・手順${m}件を取得しました。`; kind = 'ok';
    if (w.source === 'ai') { msg += 'AIで抽出したため、内容をご確認ください。'; kind = 'warn'; }
    if (w.source === 'text') { msg += '簡易解析のため、内容をご確認ください。'; kind = 'warn'; }
    if (w.note === 'caption_truncated') { msg += 'キャプションが途中までしか取得できませんでした。'; kind = 'warn'; }
  } else {
    msg = 'レシピ本文（材料・作り方）は見つかりませんでした。' + ((w.title || w.image) ? 'タイトル・写真のみ取得しました。' : '') + '手入力できます。'; kind = 'warn';
    if (ig) msg += '（動画の中だけに書かれたレシピは読み取れません）';
  }
  if (workerFail) { msg = `Workerでの取得に失敗したため、タイトル・写真のみ取得しました。${workerErrText(workerFail.error, workerFail.detail)}`; kind = 'warn'; }
  if (w.ai && String(w.ai).startsWith('error')) msg += `（AI抽出でエラー：${w.ai}）`;
  if (!workerReady() && !ig) msg += '（材料・作り方の自動取得にはログインとWorkerの設定が必要です）';
  setStatus(msg + dupNote, kind);
}

/* =====================================================================
   レシピ詳細（材料・作り方が一目でわかる画面）
   ===================================================================== */
const D = { id: null, done: new Set(), cookDate: '' };

function openDetail(id){
  if (D.id !== id) { D.done = new Set(); D.cookDate = ''; }
  D.id = id;
  renderDetail();
  $('#detailBody').scrollTop = 0;
  show($('#detail'));
}
function closeDetail(){ hide($('#detail')); }

function toggleDone(el, key){
  if (D.done.has(key)) D.done.delete(key); else D.done.add(key);
  el.classList.toggle('done', D.done.has(key));
}

function renderDetail(){
  const r = recipeById(D.id);
  if (!r) { closeDetail(); return; }
  const cooks = state.cooks.filter(c => c.recipeId === r.id).sort((a, b) => b.date.localeCompare(a.date));
  const today = ymd(new Date());
  if (!D.cookDate) D.cookDate = today;
  const hasUrl = /^https?:\/\//.test(r.url);

  // 1) コンパクトなヘッダー（写真・料理名・分量・時間）
  const meta = h('div', { class: 'd-meta' });
  if (r.servings) meta.append(h('span', { class: 'pill' }, r.servings));
  if (r.minutes) meta.append(h('span', { class: 'pill' }, `約${r.minutes}分`));
  const top = h('div', { class: 'd-top' },
    h('div', { class: 'd-thumb' }, thumbEl(r)),
    h('div', { class: 'd-info' }, h('h1', { class: 'd-title' }, r.name), meta.children.length ? meta : null));
  const sub = (r.cats.length || hasUrl) ? h('div', { class: 'd-sub' },
    r.cats.map(c => h('span', { class: 'tag' }, c)),
    hasUrl ? h('a', { class: 'pill', href: r.url, target: '_blank', rel: 'noopener noreferrer' }, (r.site || hostOf(r.url)) + ' ↗') : null) : null;

  // 2) 材料 → 3) 作り方
  const sections = [];
  if (r.ingredients.length) {
    const ul = h('ul', { class: 'ing' });
    let g = '';
    r.ingredients.forEach((it, i) => {
      const ig = it.group || '';
      if (ig && ig !== g) ul.append(h('li', { class: 'grp' }, ig));
      g = ig;
      const key = 'i' + i;
      const li = h('li', { class: D.done.has(key) ? 'done' : '' }, h('span', { class: 'nm' }, it.name), h('span', { class: 'am' }, it.amount || ''));
      li.addEventListener('click', () => toggleDone(li, key));
      ul.append(li);
    });
    sections.push(h('section', { class: 'sec' }, h('h3', {}, '材料', h('small', {}, `${r.servings ? r.servings + ' ・ ' : ''}タップでチェック`)), ul));
  }
  if (r.steps.length) {
    const ol = h('ol', { class: 'steps' });
    r.steps.forEach((t, i) => {
      const key = 's' + i;
      const li = h('li', { class: 'step' + (D.done.has(key) ? ' done' : '') }, h('span', { class: 'no' }, String(i + 1)), h('p', {}, t));
      li.addEventListener('click', () => toggleDone(li, key));
      ol.append(li);
    });
    sections.push(h('section', { class: 'sec' }, h('h3', {}, '作り方', h('small', {}, 'タップでチェック')), ol));
  }
  if (!sections.length) {
    sections.push(h('div', { class: 'noinfo' },
      '材料・作り方はまだ登録されていません。', h('br'),
      hasUrl ? '元のページから自動で取得するか、「編集」から入力できます。' : '「編集」から入力できます。',
      hasUrl ? h('div', {}, h('button', { type: 'button', class: 'pill-btn strong', onclick: () => enrichRecipe(r.id) }, 'URLから材料・作り方を取得')) : null));
  }

  // 4) 作った記録
  sections.push(h('section', { class: 'sec' }, h('h3', {}, '作った記録'),
    h('p', { class: 'cook-sum' }, cooks.length ? `${cooks.length}回 ・ 最後に作った日 ${fmtDate(cooks[0].date)}` : 'まだ記録がありません。下の「作った！」で日付を残せます。'),
    cooks.length ? h('div', { class: 'cchips' }, cooks.slice(0, 12).map(c =>
      h('span', { class: 'cchip' }, fmtDate(c.date), h('button', { type: 'button', 'aria-label': `${fmtDate(c.date)}の記録を削除`, onclick: () => store.deleteCook(c.id) }, '×')))) : null));

  $('#detailBody').replaceChildren(top, sub, ...sections);

  // 下部に固定：作った日を記録
  const dateInput = h('input', { type: 'date', value: D.cookDate, 'aria-label': '作った日', onchange: e => { D.cookDate = e.target.value || today; } });
  $('#detailFoot').replaceChildren(dateInput,
    h('button', { type: 'button', class: 'pill-btn strong', onclick: () => addCookFor(r.id, dateInput.value || today) }, '作った！'));
}

// 既存レシピ（材料・作り方が未登録）にURLから取得して追記する
async function enrichRecipe(id){
  const r = recipeById(id);
  if (!r || !r.url) return;
  if (!workerReady()) { toast('自動取得にはログインとWorkerの設定が必要です。「編集」から入力してください'); return; }
  toast('取得中…');
  const w = await workerExtract(r.url);
  if (!w || !w.ok) { toast(WORKER_ERR[w && w.error] || '取得できませんでした'); return; }
  if (!w.ingredients.length && !w.steps.length) { toast('材料・作り方が見つかりませんでした'); return; }
  const cur = recipeById(id); if (!cur) return;
  await store.saveRecipe({ ...cur, ingredients: w.ingredients.length ? w.ingredients : cur.ingredients, steps: w.steps.length ? w.steps : cur.steps,
    servings: cur.servings || w.servings || '', minutes: cur.minutes || w.minutes || 0, site: cur.site || w.siteName || '' });
  toast(`材料${w.ingredients.length}件・手順${w.steps.length}件を追加しました`);
}

$('#detailClose').addEventListener('click', closeDetail);
$('#detailEdit').addEventListener('click', () => { if (D.id) openSheet(D.id); });
$('#detail').addEventListener('click', e => { if (e.target === $('#detail')) closeDetail(); });

/* =====================================================================
   作った記録・カレンダー
   ===================================================================== */
function addCookFor(recipeId, date){
  if (state.cooks.some(c => c.recipeId === recipeId && c.date === date)) { toast('その日はすでに記録済みです'); return; }
  store.addCook({ id: uid(), recipeId, date, createdAt: Date.now() });
  toast(`${fmtDate(date)}に記録しました`);
}

const now0 = new Date();
const C = { y: now0.getFullYear(), m: now0.getMonth(), sel: ymd(now0) };

function dayCell(d, key, list){
  const cls = 'day' + (key === ymd(new Date()) ? ' today' : '') + (key === C.sel ? ' sel' : '') + (list.length ? ' has' : '');
  const el = h('button', { type: 'button', class: cls, 'aria-label': `${C.m + 1}月${d}日` + (list.length ? `、${list.length}品` : ''), onclick: () => { C.sel = key; renderCal(); } });
  if (list.length) {
    const mosaic = h('span', { class: 'mosaic m' + Math.min(list.length, 4) });
    list.slice(0, 4).forEach(r => {
      const t = h('span', { class: 'tile' });
      if (r.img) { const img = h('img', { src: r.img, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }); img.addEventListener('error', () => img.replaceWith(placeholder())); t.append(img); }
      else t.append(placeholder());
      mosaic.append(t);
    });
    el.append(mosaic);
    if (list.length > 4) el.append(h('span', { class: 'more' }, `+${list.length - 4}`));
  }
  el.append(h('span', { class: 'dn' }, String(d)));
  return el;
}

function renderCal(){
  $('#calTitle').textContent = `${C.y}年${C.m + 1}月`;
  const start = new Date(C.y, C.m, 1).getDay();
  const days = new Date(C.y, C.m + 1, 0).getDate();
  const by = new Map();
  state.cooks.forEach(c => { const r = recipeById(c.recipeId); if (!r) return; if (!by.has(c.date)) by.set(c.date, []); by.get(c.date).push(r); });
  const cells = [];
  for (let i = 0; i < start; i++) cells.push(h('div', { class: 'day blank' }));
  for (let d = 1; d <= days; d++) { const key = `${C.y}-${pad(C.m + 1)}-${pad(d)}`; cells.push(dayCell(d, key, by.get(key) || [])); }
  $('#calGrid').replaceChildren(...cells);
  renderDay();
}

function renderDay(){
  const [y, m, d] = C.sel.split('-').map(Number);
  $('#dayTitle').textContent = `${y === new Date().getFullYear() ? '' : y + '年'}${m}月${d}日（${WD[new Date(y, m - 1, d).getDay()]}）`;
  const items = state.cooks.filter(c => c.date === C.sel).map(c => ({ c, r: recipeById(c.recipeId) })).filter(x => x.r);
  const ul = $('#dayList');
  if (!items.length) { ul.replaceChildren(h('li', { class: 'hint' }, 'この日に作った料理はまだ記録されていません')); return; }
  ul.replaceChildren(...items.map(({ c, r }) => h('li', { class: 'day-item' },
    h('button', { type: 'button', class: 'di-main', onclick: () => openDetail(r.id) }, h('span', { class: 'th' }, r.img ? h('img', { src: r.img, alt: '', referrerpolicy: 'no-referrer' }) : null), h('span', { class: 'nm' }, r.name)),
    h('button', { type: 'button', class: 'di-x', 'aria-label': `${r.name}の記録を削除`, onclick: () => { store.deleteCook(c.id); toast('記録を削除しました'); } }, '×'))));
}

function moveMonth(delta){
  const d = new Date(C.y, C.m + delta, 1);
  C.y = d.getFullYear(); C.m = d.getMonth();
  renderCal();
}
$('#calPrev').addEventListener('click', () => moveMonth(-1));
$('#calNext').addEventListener('click', () => moveMonth(1));
$('#calToday').addEventListener('click', () => { const t = new Date(); C.y = t.getFullYear(); C.m = t.getMonth(); C.sel = ymd(t); renderCal(); });

/* --- 作った料理を選ぶ --- */
function renderPick(){
  const q = $('#pickQ').value.trim().toLowerCase();
  const list = state.recipes.filter(r => !q || r.name.toLowerCase().includes(q)).sort((a, b) => b.createdAt - a.createdAt);
  $('#pickList').replaceChildren(...(list.length ? list.map(r => h('li', {},
    h('button', { type: 'button', class: 'di-main', onclick: () => { addCookFor(r.id, C.sel); hide($('#pick')); } },
      h('span', { class: 'th' }, r.img ? h('img', { src: r.img, alt: '', referrerpolicy: 'no-referrer' }) : null), h('span', { class: 'nm' }, r.name))))
    : [h('li', { class: 'hint' }, state.recipes.length ? '見つかりませんでした' : 'レシピがまだありません。先にレシピを登録してください')]));
}
$('#btnAddCook').addEventListener('click', () => { $('#pickQ').value = ''; renderPick(); show($('#pick')); });
$('#pickQ').addEventListener('input', renderPick);
$('#pickClose').addEventListener('click', () => hide($('#pick')));
$('#pick').addEventListener('click', e => { if (e.target === $('#pick')) hide($('#pick')); });

/* =====================================================================
   カテゴリ編集
   ===================================================================== */
function renderCatList(){
  $('#catList').replaceChildren(...state.cats.map(c =>
    h('li', {}, h('span', {}, c), h('button', { type: 'button', class: 'x', 'aria-label': `${c}を削除`, onclick: () => delCat(c) }, '×'))));
}
function openCats(){ renderCatList(); show($('#catSheet')); }
function closeCats(){ hide($('#catSheet')); renderSheetCats(); render(); }
async function addCat(){
  const v = $('#newCat').value.trim();
  if (!v) return;
  if (state.cats.includes(v)) { toast('同じカテゴリがあります'); return; }
  if (await store.saveCats([...state.cats, v])) { $('#newCat').value = ''; }
}
async function delCat(c){
  const n = state.recipes.filter(r => r.cats.includes(c)).length;
  if (!confirm(`「${c}」を削除しますか？` + (n ? `\n${n}件のレシピから外れます（レシピ自体は消えません）。` : ''))) return;
  S.cats.delete(c);
  if (activeCat === c) activeCat = null;
  await store.deleteCat(c);
}
$('#btnCats').addEventListener('click', openCats);
$('#btnEditCats').addEventListener('click', openCats);
$('#catClose').addEventListener('click', closeCats);
$('#catSheet').addEventListener('click', e => { if (e.target === $('#catSheet')) closeCats(); });
$('#btnAddCat').addEventListener('click', addCat);
$('#newCat').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addCat(); } });

/* =====================================================================
   アカウント
   ===================================================================== */
let workerCheckMsg = '';
async function checkWorker(){
  workerCheckMsg = '確認中…'; renderAcct();
  try {
    const r = await fetchT(W() + '/health', 15000, { headers: { 'Authorization': 'Bearer ' + await idToken() } });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) workerCheckMsg = `接続OK・ログイン認証OK（${j.email}）。AI抽出：` + (j.ai ? 'APIキー設定済み' : 'APIキー未設定（構造化データのあるサイトと、見出し付きのキャプションのみ取得可）');
    else workerCheckMsg = workerErrText(j.error || ('http_' + r.status), j.detail);
  } catch (e) { workerCheckMsg = workerErrText('network'); }
  renderAcct();
}
function renderAcct(){
  const body = $('#acctBody');
  const nodes = [];
  if (store.mode === 'cloud' && cloud && cloud.user) {
    nodes.push(h('div', { class: 'box' }, h('h3', {}, '端末間の同期'),
      h('p', {}, 'オン。ログイン中のアカウント：', h('span', { class: 'kv' }, cloud.user.email || '')),
      h('p', {}, '別の端末で同じメールアドレスとパスワードでログインすると、同じレシピ・カレンダーが表示されます。'),
      h('button', { type: 'button', class: 'pill-btn', onclick: () => cloud.A.signOut(cloud.auth) }, 'ログアウト')));
  } else {
    nodes.push(h('div', { class: 'box' }, h('h3', {}, '端末間の同期'),
      h('p', {}, cloudConfigured ? 'この端末のデータだけで動作中です（ログインしていません）。' : 'オフ（この端末のブラウザ内にだけ保存されます）。'),
      h('p', {}, cloudConfigured ? 'ページを再読み込みするとログイン画面に戻ります。' : '同期するには、index.html の CONFIG に Firebase の設定を入れてください（マニュアル参照）。')));
  }
  nodes.push(h('div', { class: 'box' }, h('h3', {}, 'レシピの自動取得（材料・作り方）'),
    h('p', {}, workerReady() ? '設定済みです。URLを貼ると材料・作り方・写真を取り込みます。Instagramのキャプションにも対応します。'
      : (CONFIG.workerUrl ? 'ログインすると利用できます。' : '未設定です。index.html の CONFIG の workerUrl に Cloudflare Worker のURLを入れると使えます（マニュアル参照）。')),
    workerReady() ? h('button', { type: 'button', class: 'pill-btn', onclick: checkWorker }, '接続テスト') : null,
    workerCheckMsg ? h('p', { id: 'workerResult', style: 'margin-top:10px' }, workerCheckMsg) : null));
  nodes.push(h('div', { class: 'box' }, h('h3', {}, 'データ'), h('p', {}, `レシピ ${state.recipes.length}件 ・ 作った記録 ${state.cooks.length}件 ・ カテゴリ ${state.cats.length}個`)));
  body.replaceChildren(...nodes);
}

/* =====================================================================
   イベント・起動
   ===================================================================== */
$('#q').addEventListener('input', render);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  for (const [id, fn] of [['#pick', () => hide($('#pick'))], ['#catSheet', closeCats], ['#sheet', closeSheet], ['#detail', closeDetail]]) {
    if (!$(id).hidden) { fn(); break; }
  }
});

let startUrl = '';
function consumeStartUrl(){
  if (!startUrl) return;
  const u = startUrl; startUrl = '';
  setTab('recipes'); openSheet(null, u);
}
function startLocal(){
  store = localStore;
  Object.assign(state, loadLocal(), { ready: true });
  refresh();
  consumeStartUrl();
}

(function boot(){
  // ?url=... で開くと登録画面にURLを入れた状態で始まる（ショートカット連携用）
  const qp = new URLSearchParams(location.search);
  startUrl = extractUrl(qp.get('url') || qp.get('text') || '');
  if (startUrl) history.replaceState(null, '', location.pathname);
  setTab('recipes');
  if (!cloudConfigured) { hideAuth(); startLocal(); return; }
  showAuth('loading');
  initCloud().catch(e => { console.error(e); showAuth('error'); });
})();
})();
</script>
</body>
